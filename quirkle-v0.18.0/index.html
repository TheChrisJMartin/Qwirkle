<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Qwirkle</title>
<style>
  :root{
    --bar:120px;
    --felt:#1f3d34;--felt2:#12241f;
    --tile:#15151a;--tile2:#26262e;
    --ink:#f3efe6;--muted:#9fb3aa;--line:#2c4a41;--slot:#3a6156;--accent:#e5b93c;
    --r:#d0453f;--o:#e07a2f;--y:#e5b93c;--g:#3f9d54;--b:#3d78b5;--p:#8a4fa3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:"Iowan Old Style",Palatino,Georgia,serif;color:var(--ink);
    background:radial-gradient(130% 100% at 50% 0%,var(--felt),var(--felt2));height:100dvh}

  /* board viewport */
  #viewport{position:fixed;left:0;right:0;top:0;bottom:var(--bar);overflow:hidden;
    touch-action:none;transition:filter .2s}
  #viewport.blur{filter:blur(6px) brightness(.7)}
  #boardInner{position:relative;transform-origin:0 0;width:0;height:0}
  .tile,.slot{position:absolute;width:46px;height:46px}
  .tile .face{width:100%;height:100%;border-radius:8px;
    background:linear-gradient(160deg,var(--tile2),var(--tile));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 5px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center}
  .tile.pending .face{outline:2px solid var(--accent);outline-offset:-2px}
  .glyph{width:74%;height:74%;display:block}
  .slot{padding:6px;cursor:pointer}
  .slot .drop{width:100%;height:100%;border-radius:8px;border:1.5px dashed var(--slot);
    background:rgba(255,255,255,.03)}
  .slot:active .drop{background:rgba(229,185,60,.22)}

  /* status pill + hint */
  #status{position:fixed;top:12px;left:62px;z-index:5;background:rgba(0,0,0,.4);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;letter-spacing:.02em}
  #hint{position:fixed;top:10px;right:10px;z-index:5;font-size:11px;color:var(--muted);
    background:rgba(0,0,0,.35);padding:5px 10px;border-radius:999px}

  /* toaster */
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:30;
    background:rgba(12,22,18,.94);border:1px solid var(--line);border-radius:12px;padding:9px 14px;
    display:flex;align-items:center;gap:9px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;
    pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .pts{color:var(--accent);font-weight:700}
  .mini{width:22px;height:22px;border-radius:5px;background:linear-gradient(160deg,var(--tile2),var(--tile));
    display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .mini svg{width:15px;height:15px}

  /* bottom bar */
  #bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);z-index:10;
    background:linear-gradient(180deg,rgba(10,20,17,.6),rgba(8,16,13,.96));
    border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;justify-content:center}
  #rack{display:flex;gap:7px;justify-content:center}
  #rack .tile{position:static;width:46px;height:46px;cursor:pointer;transition:transform .08s}
  #rack .tile.sel{transform:translateY(-6px)}
  #rack .tile.sel .face{outline:2px solid var(--accent);outline-offset:-2px}
  #rack .tile.swap .face{outline:2px solid var(--b);outline-offset:-2px}
  #rack .empty{width:46px;height:46px;border-radius:8px;border:1px dashed var(--line);opacity:.45}
  #btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  #btns button{font:inherit;font-size:14px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:#23433a;color:var(--ink);cursor:pointer;min-width:56px}
  #btns button:active{transform:translateY(1px)}
  #btns button.primary{background:var(--accent);color:#2a2410;border-color:transparent;font-weight:700}
  #btns button:disabled{opacity:.38}

  /* modal */
  #modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(6,12,10,.55)}
  #modal.on{display:flex}
  .sheet{background:linear-gradient(160deg,#20423a,#12241f);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:440px;max-height:86dvh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;
    border-bottom:1px solid var(--line);flex-shrink:0}
  .sheet header h2{margin:0;font-size:20px;font-weight:600}
  .sheet .x{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .sheet .body{padding:16px 18px;overflow:auto;flex:1;min-height:0}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border-bottom:0}
  .row .who{display:flex;align-items:center;gap:8px}
  .num{font-variant-numeric:tabular-nums}
  .big{font-size:26px;font-weight:700}
  .cap{color:var(--muted);font-size:12px;margin:2px 0 12px}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:20px;font-weight:700;margin-top:3px}
  .logline{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
  .logline .nm{min-width:64px;color:var(--muted);font-size:13px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;font:inherit;padding:9px;border-radius:9px;border:1px solid var(--line);background:#23433a;color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--accent);color:#2a2410;border-color:transparent;font-weight:700}
  input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink)}
  .start{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#2a2410;font-weight:700;cursor:pointer;margin-top:4px}
  .err{background:#4a2320;border:1px solid #7d3a34;color:#f2c9c4;border-radius:9px;padding:10px;margin-top:12px;font-size:14px;display:none}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.turn{background:var(--accent);box-shadow:0 0 0 3px rgba(229,185,60,.25)}
  #bPlay.flashok{background:#3f9d54;color:#08130b;border-color:transparent;animation:pg 1s infinite}
  #bReset.flashbad{border-color:#d0453f;color:#f2c9c4;animation:pr 1s infinite}
  @keyframes pg{0%,100%{box-shadow:0 0 0 0 rgba(63,157,84,0)}50%{box-shadow:0 0 0 4px rgba(63,157,84,.65)}}
  @keyframes pr{0%,100%{box-shadow:0 0 0 0 rgba(208,69,63,0)}50%{box-shadow:0 0 0 4px rgba(208,69,63,.6)}}
  .tile.r1 .face{outline:2px solid #ffffff;outline-offset:-2px}
  .tile.r2 .face{outline:2px solid #b3bdb8;outline-offset:-2px}
  .tile.r3 .face{outline:2px solid #66716b;outline-offset:-2px}
  #mSub{color:var(--muted);font-size:12px;margin-top:2px}
  .waiting{font-size:14px;color:var(--accent)}
  .qbadge{background:var(--accent);color:#2a2410;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.05em}
  .pts{color:var(--accent);font-weight:700}
  .started b{color:var(--muted);letter-spacing:.12em;font-size:12px}
  .prow{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .prow:last-child{border-bottom:0}
  .pn{font-size:15px;margin-bottom:3px}
  .pd{color:var(--muted);font-size:12px;line-height:1.5}
  .tabbar{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .tabbar button{flex:1;background:none;border:none;color:var(--muted);padding:9px 4px;font-size:13px;border-bottom:2px solid transparent;cursor:pointer}
  .tabbar button.on{color:var(--fg);border-bottom-color:var(--accent)}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.stbl{width:100%;border-collapse:collapse;font-size:12px}
  table.stbl th,table.stbl td{padding:6px 5px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
  table.stbl th:first-child,table.stbl td:first-child{text-align:left}
  table.stbl th{color:var(--muted);font-weight:600;font-size:11px}
  .achgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .ach{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .ach.lock{opacity:.42}
  .ach .an{font-size:13px;font-weight:600}
  .ach .ad{color:var(--muted);font-size:11px;line-height:1.4;margin-top:2px}
  .ach .pips{color:var(--accent);font-size:10px;letter-spacing:1px;margin-top:5px}
  .ach.soon .an::after{content:' · soon';color:var(--muted);font-weight:400;font-size:10px}
  .acct{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:14px;font-size:13px}
  .acct .lnk{color:var(--accent);cursor:pointer}
  .authrow{display:flex;gap:6px;margin-top:8px}
  .authrow input{flex:1;background:#12241f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px}
  .authrow button{flex:1;background:#1a332c;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13px;cursor:pointer}
  .persona{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .persona .pnm{width:58px;font-size:13px;color:var(--fg)}
  .persona select{flex:1;background:#12241f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
  #toast .ach2{color:var(--accent);font-weight:700}
  #burger{position:fixed;top:10px;left:10px;z-index:14;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--fg);font-size:19px;display:none;align-items:center;justify-content:center;cursor:pointer}
  #burger.show{display:flex}
  #menu{position:fixed;top:58px;left:10px;z-index:14;background:linear-gradient(160deg,#20423a,#12241f);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,.6);min-width:180px;display:none;overflow:hidden}
  #menu.on{display:block}
  #menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--fg);padding:13px 16px;font:inherit;font-size:14px;cursor:pointer}
  #menu button:active{background:rgba(255,255,255,.06)}
  #menu .sep{height:1px;background:var(--line)}
  button.ghost{width:100%;margin-top:9px;background:#1a332c;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:14px;cursor:pointer}
  .linkrow{margin-top:12px;text-align:center}
  .ok{display:none;color:#7fd39a;font-size:13px;margin-top:11px}
  .achwhen{color:var(--accent);font-size:10px;margin-top:3px}
  #toast.qwirkle{background:#0a0f0d;border:1px solid #e5b93c;box-shadow:0 0 22px rgba(229,185,60,.45);padding:12px 18px}
  .qwletters span{font-weight:800;font-size:19px;letter-spacing:1px}
  .winner{font-size:20px;font-weight:700;color:var(--accent);text-align:center;margin:2px 0 14px}
  .lvlsel{width:100%;background:#12241f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
  .ach.fresh{border-color:#3f9d54;box-shadow:0 0 0 1px #3f9d54 inset,0 0 14px rgba(63,157,84,.28)}
  .ach .newbadge{display:inline-block;background:#3f9d54;color:#08130b;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:6px;vertical-align:middle;letter-spacing:.05em}
  .netrow{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,0.02)}
  .netrow b{color:var(--fg)}
  @keyframes pulseY{0%,100%{box-shadow:0 0 0 0 rgba(229,185,60,0)}50%{box-shadow:0 0 0 3px rgba(229,185,60,.55)}}
  @keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(63,157,84,0)}50%{box-shadow:0 0 0 3px rgba(63,157,84,.6)}}
  @keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(199,75,63,0)}50%{box-shadow:0 0 0 3px rgba(199,75,63,.6)}}
  #bPlay.flashturn{background:#e5b93c;color:#2a2410;animation:pulseY 1.1s ease-in-out infinite}
  #bPlay.flashok{background:#3f9d54;color:#08130b;animation:pulseG .9s ease-in-out infinite}
  #bReset.flashbad{background:#c74b3f;color:#fff;animation:pulseR .9s ease-in-out infinite}
  .tile.illegal{outline:3px solid #e5533f;outline-offset:-1px;box-shadow:0 0 8px rgba(229,83,63,.7);border-radius:5px}
  #scores{position:fixed;bottom:calc(var(--bar) + 8px);right:8px;z-index:25;background:rgba(12,26,22,.82);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:10.5px;color:#8fa39b;min-width:86px;max-width:40vw;backdrop-filter:blur(3px);line-height:1.32}
  #scores .row{display:flex;justify-content:space-between;gap:9px;white-space:nowrap}
  #scores .row.cur{color:var(--accent)}
  #scores .row .nm{overflow:hidden;text-overflow:ellipsis;max-width:22vw}
  #scores .row .sc{font-weight:700;color:var(--fg)} #scores .row.cur .sc{color:var(--accent)}
  #scores .row .tl{opacity:.5;margin-left:6px;font-weight:400}
  #bag{position:fixed;bottom:calc(var(--bar) + 8px);left:8px;z-index:25;display:flex;align-items:center;gap:5px;background:rgba(12,26,22,.82);border:1px solid var(--line);border-radius:9px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--fg);backdrop-filter:blur(3px)}
  #bag svg{display:block}
  .about h3.ab{font-size:13px;color:var(--fg);margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .about h3.ab:first-child{margin-top:0}
  .about .abrow{margin:7px 0} .about .abrow b{color:var(--fg)}
  .about .pips{letter-spacing:1px;color:#3a5049;font-size:10px} .about .pips .on{color:var(--accent)}
</style>
</head>
<body>
  <div id="viewport"><div id="boardInner"></div></div>
  <div id="toast"></div>
  <div id="scores"></div>
  <div id="bag"></div>

  <button id="burger">&#9776;</button>
  <div id="menu">
    <button data-a="log">Game log</button>
    <button data-a="scores">Scores</button>
    <button data-a="stats">Stats</button>
    <button data-a="ach">Achievements</button>
    <button data-a="new">New game</button>
    <button data-a="online">My games</button>
    <button data-a="about">About &amp; help</button>
    <div class="sep"></div>
    <button data-a="quit">Quit game</button>
  </div>

  <div id="bar">
    <div id="rack"></div>
    <div id="btns">
      <button class="primary" id="bPlay">Play</button>
      <button id="bSwap">Swap</button>
      <button id="bReset">Reset</button>
    </div>
  </div>

  <div id="modal"><div class="sheet"><header><div><h2 id="mTitle"></h2><div id="mSub"></div></div><button class="x" id="mClose">&times;</button></header><div class="body" id="mBody"></div></div></div>

<script>
const CELL=46;
const COL={r:'var(--r)',o:'var(--o)',y:'var(--y)',g:'var(--g)',b:'var(--b)',p:'var(--p)'};
let S=null, pending=[], selRack=null, swapMode=false, swapSel=new Set(), botsRunning=false;
let thinkTimes=[], humanTurnStart=null;
let currentUser=null;
let busy=false, rosterPick=[];
let lastPlace={x:null,y:null,t:0}, lastPickWarn=0;
let statTab='game', unlockedThisGame=0, lastGameUnlocks=new Set();
let netGame=false, pendingJoin=null, netBots=1, netDiff='medium', netWs=null, netSeen=0, netPoll=null;
let view={tx:0,ty:0,s:1};

/* ---------- glyphs ---------- */
function starPts(cx,cy,sp,o,i){let p=[],rot=-Math.PI/2,st=Math.PI/sp;for(let k=0;k<sp*2;k++){let r=(k%2===0)?o:i,a=rot+k*st;p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1));}return p.join(' ');}
function shapeSvg(sh,f){switch(sh){
  case 'c':return `<circle cx="50" cy="50" r="30" fill="${f}"/>`;
  case 'q':return `<rect x="22" y="22" width="56" height="56" rx="7" fill="${f}"/>`;
  case 'd':return `<polygon points="50,14 86,50 50,86 14,50" fill="${f}"/>`;
  case 'l':return `<g fill="${f}"><circle cx="50" cy="33" r="17"/><circle cx="67" cy="50" r="17"/><circle cx="50" cy="67" r="17"/><circle cx="33" cy="50" r="17"/><circle cx="50" cy="50" r="15"/></g>`;
  case 'x':return `<polygon points="50,13 61,39 87,50 61,61 50,87 39,61 13,50 39,39" fill="${f}"/>`;
  case 'e':return `<polygon points="${starPts(50,50,8,37,15)}" fill="${f}"/>`;}return '';}
function glyph(code){return `<svg class="glyph" viewBox="0 0 100 100">${shapeSvg(code[1],COL[code[0]]||'#fff')}</svg>`;}
function face(code){return `<div class="face">${glyph(code)}</div>`;}
function mini(code){return `<span class="mini"><svg viewBox="0 0 100 100">${shapeSvg(code[1],COL[code[0]]||'#fff')}</svg></span>`;}
function miniRow(codes){return codes.map(mini).join('');}

/* ---------- api ---------- */
async function api(path,method,body){
  const o={method};
  if(body){o.headers={'Content-Type':'application/x-www-form-urlencoded'};o.body=new URLSearchParams(body).toString();}
  const r=await fetch(path,o); let d; try{d=await r.json();}catch(e){d={error:'Unexpected response.'};}
  if(!r.ok) throw new Error(d.error||('Request failed ('+r.status+').')); return d;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- geometry / view ---------- */
function occMap(){const m=new Map();if(S){S.board.forEach(t=>m.set(t.x+','+t.y,t.t));}pending.forEach(p=>m.set(p.x+','+p.y,p.code));return m;}
function anchors(occ){if(occ.size===0)return new Set(['0,0']);const a=new Set();
  for(const k of occ.keys()){const[x,y]=k.split(',').map(Number);[[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{const nk=(x+d[0])+','+(y+d[1]);if(!occ.has(nk))a.add(nk);});}return a;}
function allowed(anch){if(pending.length===0)return anch;const out=new Set();
  anch.forEach(k=>{const[x,y]=k.split(',').map(Number);const cs=pending.concat([{x,y}]);
    if(cs.every(c=>c.x===cs[0].x)||cs.every(c=>c.y===cs[0].y))out.add(k);});return out;}
function lastMoveRanks(){const m=new Map();if(!S||!S.events)return m;
  const mv=S.events.filter(e=>e.kind==='MOVE').slice(-3);
  mv.forEach((e,idx)=>{const rank=mv.length-idx;(e.cells||[]).forEach(c=>m.set(c.x+','+c.y,rank));});return m;}
function validatePending(){
  if(pending.length===0)return{empty:true,legal:false,points:0};
  const board=new Map();S.board.forEach(t=>board.set(t.x+','+t.y,t.t));
  const temp=new Map(board);pending.forEach(p=>temp.set(p.x+','+p.y,p.code));
  const first=board.size===0, single=pending.length===1;
  const has=(x,y)=>temp.has(x+','+y);
  let axis=null;
  if(!single){const sx=pending.every(p=>p.x===pending[0].x),sy=pending.every(p=>p.y===pending[0].y);
    if(sy)axis='h';else if(sx)axis='v';else return{legal:false,points:0};
    if(axis==='h'){const y=pending[0].y,xs=pending.map(p=>p.x),lo=Math.min(...xs),hi=Math.max(...xs);for(let x=lo;x<=hi;x++)if(!has(x,y))return{legal:false,points:0};}
    else{const x=pending[0].x,ys=pending.map(p=>p.y),lo=Math.min(...ys),hi=Math.max(...ys);for(let y=lo;y<=hi;y++)if(!has(x,y))return{legal:false,points:0};}}
  if(!first){const conn=pending.some(p=>[[1,0],[-1,0],[0,1],[0,-1]].some(d=>board.has((p.x+d[0])+','+(p.y+d[1]))));if(!conn)return{legal:false,points:0};}
  function run(x,y,dir){const dx=dir==='h'?1:0,dy=dir==='h'?0:1;let sx=x,sy=y;
    while(has(sx-dx,sy-dy)){sx-=dx;sy-=dy;}const arr=[];let ex=sx,ey=sy;
    while(has(ex,ey)){arr.push(temp.get(ex+','+ey));ex+=dx;ey+=dy;}return arr;}
  const seen=new Set(),lines=[];
  function addLine(x,y,dir){const arr=run(x,y,dir);if(arr.length<1)return;
    let sx=x,sy=y;const dx=dir==='h'?1:0,dy=dir==='h'?0:1;while(has(sx-dx,sy-dy)){sx-=dx;sy-=dy;}
    const key=dir+sx+','+sy;if(seen.has(key))return;seen.add(key);lines.push(arr);}
  if(single){addLine(pending[0].x,pending[0].y,'h');addLine(pending[0].x,pending[0].y,'v');}
  else{addLine(pending[0].x,pending[0].y,axis);pending.forEach(p=>addLine(p.x,p.y,axis==='h'?'v':'h'));}
  let points=0,scoring=0;
  for(const arr of lines){if(arr.length<2)continue;if(arr.length>6)return{legal:false,points:0};
    if(new Set(arr).size!==arr.length)return{legal:false,points:0};
    const sameC=arr.every(c=>c[0]===arr[0][0]),sameS=arr.every(c=>c[1]===arr[0][1]);
    if(!sameC&&!sameS)return{legal:false,points:0};
    points+=arr.length;if(arr.length===6)points+=6;scoring++;}
  if(scoring===0)points=pending.length;
  return{legal:true,points,empty:false};}
function applyView(){document.getElementById('boardInner').style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.s})`;}
function contentBounds(){const occ=occMap();let xs=[],ys=[];occ.forEach((v,k)=>{const[x,y]=k.split(',').map(Number);xs.push(x);ys.push(y);});
  if(xs.length===0)return{minX:-1,maxX:1,minY:-1,maxY:1};
  return{minX:Math.min(...xs)-1,maxX:Math.max(...xs)+1,minY:Math.min(...ys)-1,maxY:Math.max(...ys)+1};}
function fitBoard(){const vp=document.getElementById('viewport');const b=contentBounds();
  const iw=(b.maxX-b.minX+1)*CELL, ih=(b.maxY-b.minY+1)*CELL;
  let s=Math.min(vp.clientWidth/iw, vp.clientHeight/ih); s=Math.max(.35,Math.min(1.4,s*0.92));
  view.s=s; view.tx=(vp.clientWidth-iw*s)/2 - b.minX*CELL*s; view.ty=(vp.clientHeight-ih*s)/2 - b.minY*CELL*s; applyView();}

/* ---------- render ---------- */
function render(){
  if(S){if(S.status==='IN_PROGRESS'&&S.current===S.yourSeat&&!botsRunning){if(humanTurnStart===null)humanTurnStart=Date.now();}else humanTurnStart=null;}
  updateChrome();
  const inner=document.getElementById('boardInner'); inner.innerHTML='';
  const occ=occMap(); const cellRank=lastMoveRanks();
  for(const[k,code] of occ){const[x,y]=k.split(',').map(Number);
    const pend=pending.some(p=>p.x===x&&p.y===y);
    let cls='tile'+(pend?' pending':'');if(!pend&&cellRank.has(k))cls+=' r'+cellRank.get(k);
    const d=document.createElement('div');d.className=cls;
    d.style.left=(x*CELL)+'px';d.style.top=(y*CELL)+'px';d.innerHTML=face(code);inner.appendChild(d);}
  const interactive=S&&S.status==='IN_PROGRESS'&&S.current===S.yourSeat&&!botsRunning&&!swapMode;
  if(interactive){allowed(anchors(occ)).forEach(k=>{if(occ.has(k))return;const[x,y]=k.split(',').map(Number);
    const s=document.createElement('div');s.className='slot';s.style.left=(x*CELL)+'px';s.style.top=(y*CELL)+'px';
    s.dataset.x=x;s.dataset.y=y;
    s.innerHTML='<div class="drop"></div>';s.onclick=()=>placeAt(x,y);inner.appendChild(s);});}
  renderScores(); renderRack(); renderControls();
}

    d.onclick=()=>{if(swapMode){swapSel.has(i)?swapSel.delete(i):swapSel.add(i);}else{if(S.current!==S.yourSeat||botsRunning)return;selRack=(selRack===i?null:i);}render();};
    r.appendChild(d);});}
const POUCH_SVG='<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 9 C6.4 9 9 7.4 12 7.4 C15 7.4 17.6 9 17.6 9 L20 18.6 C20 20.5 16.4 22 12 22 C7.6 22 4 20.5 4 18.6 Z" fill="#c9a24b" stroke="#7a5f24" stroke-width="1"/><path d="M8 8.4 C8 6.1 9.8 4.6 12 4.6 C14.2 4.6 16 6.1 16 8.4" fill="none" stroke="#7a5f24" stroke-width="1.5"/><ellipse cx="12" cy="8.7" rx="6" ry="1.5" fill="#7a5f24" opacity="0.45"/></svg>';

function markIllegal(){const ts=document.querySelectorAll('#boardInner .tile.pending');if(ts.length)ts[ts.length-1].classList.add('illegal');}
function renderControls(){const fin=S&&S.status==='FINISHED';const myturn=S&&S.current===S.yourSeat&&!botsRunning;
  const play=document.getElementById('bPlay'),reset=document.getElementById('bReset'),swap=document.getElementById('bSwap');

/* ---------- actions ---------- */
function placeAt(x,y){if(swapMode||!S||S.current!==S.yourSeat||botsRunning)return;
  const now=Date.now();
  if(selRack===null){if(!(lastPickWarn&&now-lastPickWarn<600))flash('Pick a tile first.');lastPickWarn=now;return;}
  if(lastPlace.x===x&&lastPlace.y===y&&now-lastPlace.t<600)return; // dedupe click + pointer-up double fire
  lastPlace={x,y,t:now};
  pending.push({x,y,code:S.hand[selRack],rackIdx:selRack});selRack=null;render();}
function resetOrCancel(){if(swapMode){swapMode=false;swapSel.clear();}else{pending=[];selRack=null;}render();}
async function playMove(){if(netGame&&pending.length===0&&S&&!S.youHaveMove&&S.current===S.yourSeat)return netPass();
  if(busy||pending.length===0)return;
  const v=validatePending();if(!v.legal){flash("That move isn't legal yet.");return;}
  busy=true;setBarDisabled(true);
  let thinkMs=0;if(humanTurnStart!==null){thinkMs=Date.now()-humanTurnStart;thinkTimes.push(thinkMs/1000);humanTurnStart=null;}
  const p=pending.map(p=>`${p.x},${p.y},${p.code}`).join(';');
  try{const url=netGame?('api/net/game/'+S.id+'/move'):('api/game/'+S.id+'/move');
    const d=await api(url,'POST',{placements:p,thinkMs});S=d;pending=[];selRack=null;render();
    if(!netGame){if(d.lastPoints>0)toast(`<span class="pts">+${d.lastPoints}</span> for your move`,1600);
      if(d.lastQwirkles>0)qwirkleToast('You',d.lastQwirkles);}
    await showUnlocks(d);busy=false;if(netGame)afterNetTurn(d);else runBots();}
  catch(e){busy=false;flash(e.message);render();}}
async function swapAction(){
  if(busy)return;
  if(!swapMode){swapMode=true;pending=[];selRack=null;render();return;}
  const tiles=[...swapSel].map(i=>S.hand[i]).join(',');
  if(!tiles){swapMode=false;render();return;}
  busy=true;setBarDisabled(true);
  let thinkMs=0;if(humanTurnStart!==null){thinkMs=Date.now()-humanTurnStart;thinkTimes.push(thinkMs/1000);humanTurnStart=null;}
  try{const url=netGame?('api/net/game/'+S.id+'/swap'):('api/game/'+S.id+'/swap');
    const d=await api(url,'POST',{tiles,thinkMs});S=d;swapMode=false;swapSel.clear();render();
    if(!netGame)toast(`Swapped ${tiles.split(',').length}`,1400);await showUnlocks(d);busy=false;if(netGame)afterNetTurn(d);else runBots();}
  catch(e){busy=false;flash(e.message);render();}}
async function runBots(){if(botsRunning)return;botsRunning=true;render();
  while(S&&S.status==='IN_PROGRESS'&&S.current!==S.yourSeat){
    const name=S.seats[S.current].name;
    toast(`<b>${esc(name)}</b> is thinking…`,1000);
    await sleep(1100);
    let d;try{d=await api('api/game/'+S.id+'/advance','POST',{});}catch(e){break;}
    S=d;render();if(d.lastMove)botToast(d.lastMove);
    if(d.lastQwirkles>0)qwirkleToast(d.lastScorer||(d.lastMove&&d.lastMove.name)||'',d.lastQwirkles);
    await sleep(1400);await showUnlocks(d);}
  botsRunning=false;render();
  if(S&&S.status==='IN_PROGRESS'&&S.current===S.yourSeat){
    if(!S.youHaveMove&&S.bag===0){
      try{const d=await api('api/game/'+S.id+'/pass','POST',{});S=d;if(d.lastMove)botToast(d.lastMove);render();await sleep(1200);return runBots();}catch(e){}
    } else announceTurn();
  }
  maybeGameOver();
}
let gameOverShown=false;
function maybeGameOver(){if(S&&S.status==='FINISHED'&&!gameOverShown){gameOverShown=true;showGameOver();}}
function showGameOver(){
  const seats=[...S.seats].sort((a,b)=>b.score-a.score);
  const top=seats[0].score, winners=seats.filter(s=>s.score===top);
  const title=winners.length>1?"It's a tie!":`${esc(winners[0].name)} wins!`;
  const rows=seats.map((s,i)=>`<div class="row"><div class="who">${(i===0&&winners.length===1)?'🏆 ':''}${esc(s.name)} <span class="cap">${s.ai?'bot':'you'}</span></div><div class="big num">${s.score}</div></div>`).join('');
  const achBtn=(currentUser&&unlockedThisGame>0)?`<button class="ghost" id="goAch">View achievements (${unlockedThisGame})</button>`:'';
  let prog='';
  if(S.gameMode==='progressive'){
    const met=S.levelMet;
    prog=`<div class="acct" style="text-align:center;border-color:${met?'#3f9d54':'#2c4a40'}">
      <div style="font-size:16px;font-weight:700;color:${met?'#7fd39a':'var(--fg)'}">${met?`Level ${S.gameLevel} complete!`:`Level ${S.gameLevel} not cleared`}</div>
      <div class="cap" style="margin-top:4px">${esc(S.levelObjective||'')}</div>
      ${met?'<div class="cap" style="margin-top:4px;color:var(--accent)">Advanced to the next level.</div>':'<div class="cap" style="margin-top:4px">Try again to climb.</div>'}</div>`;
  }
  openModal('Game over',`<div class="winner">${title}</div>${prog}${rows}${achBtn}<button class="start" id="goNew">${S.gameMode==='progressive'?'Continue':'New game'}</button><button class="ghost" id="goDismiss">Dismiss &amp; view board</button>`);
  document.getElementById('mSub').textContent='Final scores';

}

function toast(html,dur=1700,cls=''){toastQ.push({html,dur,cls});pumpToast();}
let toastQ=[],toastActive=false;
async function pumpToast(){if(toastActive)return;toastActive=true;const t=document.getElementById('toast');
  while(toastQ.length){const m=toastQ.shift();t.innerHTML=m.html;t.className=m.cls?('show '+m.cls):'show';await sleep(m.dur);t.className='';await sleep(160);}
  toastActive=false;}
function qwirkleToast(name,count){const cols=['#c74b3f','#d98a3a','#e5c23c','#4a9d5b','#4a78c7','#8b5ea8'];
  const word='QWIRKLE!';let letters='';for(let i=0;i<word.length;i++)letters+=`<span style="color:${cols[i%cols.length]}">${word[i]}</span>`;
  const x=count>1?` ×${count}`:'';

/* ---------- helpers ---------- */
function flash(m){toast(esc(m));}
function esc(s){return (''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- pan / zoom ---------- */
(function(){const vp=document.getElementById('viewport');let pointers=new Map(),panStart=null,pinch=null,moved=false,suppress=false,lastTap=0;
  const two=()=>{const a=[...pointers.values()];return [a[0],a[1]];};
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  vp.addEventListener('pointerdown',e=>{vp.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(pointers.size===1)panStart={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};
    else if(pointers.size===2){const[a,b]=two();pinch={d:dist(a,b),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s:view.s,tx:view.tx,ty:view.ty};panStart=null;}});
  vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2&&pinch){const[a,b]=two();const nd=dist(a,b);let ns=Math.max(.3,Math.min(3,pinch.s*(nd/pinch.d)));
      view.s=ns;view.tx=pinch.mx-((pinch.mx-pinch.tx)/pinch.s)*ns;view.ty=pinch.my-((pinch.my-pinch.ty)/pinch.s)*ns;applyView();moved=true;}
    else if(pointers.size===1&&panStart){const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;if(Math.abs(dx)+Math.abs(dy)>10)moved=true;
      view.tx=panStart.tx+dx;view.ty=panStart.ty+dy;applyView();}});
  function up(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;
    if(pointers.size===1){const p=[...pointers.values()][0];panStart={x:p.x,y:p.y,tx:view.tx,ty:view.ty};}
    if(pointers.size===0){
      if(moved){suppress=true;setTimeout(()=>suppress=false,60);}
      else{
        // Place directly from the tap position — independent of native click / pointer capture.
        let slot=null;
        try{const el=document.elementFromPoint(e.clientX,e.clientY);slot=el&&el.closest?el.closest('.slot'):null;}catch(_){}
        if(slot&&slot.dataset.x!==undefined){placeAt(+slot.dataset.x,+slot.dataset.y);}
        else{const now=Date.now();if(now-lastTap<300){fitBoard();}lastTap=now;}
      }
    }}
  vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
  vp.addEventListener('click',e=>{if(suppress){e.stopPropagation();e.preventDefault();}},true);
  vp.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015);const ns=Math.max(.3,Math.min(3,view.s*f));
    view.tx=e.clientX-((e.clientX-view.tx)/view.s)*ns;view.ty=e.clientY-((e.clientY-view.ty)/view.s)*ns;view.s=ns;applyView();},{passive:false});
})();

/* ---------- wire ---------- */
document.getElementById('bPlay').onclick=playMove;
document.getElementById('bSwap').onclick=swapAction;
document.getElementById('bReset').onclick=resetOrCancel;
document.getElementById('burger').onclick=e=>{e.stopPropagation();document.getElementById('menu').classList.toggle('on');};
document.getElementById('menu').onclick=e=>{const a=e.target.dataset.a;if(!a)return;
  document.getElementById('menu').classList.remove('on');
  if(a==='log')openLog();else if(a==='scores')openScores();else if(a==='stats')openStats();else if(a==='ach')openAchievements();else if(a==='online')showOnline();else if(a==='new')newGameFromMenu();else if(a==='about')showAbout();else if(a==='quit')quit();};
document.addEventListener('click',e=>{const m=document.getElementById('menu');
  if(m.classList.contains('on')&&!m.contains(e.target)&&e.target.id!=='burger')m.classList.remove('on');});
document.getElementById('mClose').onclick=()=>{if(S)closeModal();else showAuth();};
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&S)closeModal();});
window.addEventListener('resize',()=>{if(S)applyView();});

async function fetchMe(){try{const d=await api('api/auth/me','GET');currentUser=d.user||null;}catch(e){currentUser=null;}}
(async()=>{
  const resetTok=new URLSearchParams(location.search).get('reset');
  if(resetTok){showReset(resetTok);return;}
  await fetchMe();
  const hash=location.hash.replace('#','');
  if(hash.indexOf('join=')===0){if(currentUser)return joinNet(hash.slice(5));pendingJoin=hash.slice(5);return showAuth();}
  if(hash.indexOf('g=')===0){if(currentUser)return loadNetGame(hash.slice(2));return showAuth();}
  if(hash&&/^\d+$/.test(hash)){loadGame(hash);return;}
  showAuth();
})();
</script>
